<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary SEO Metadata -->
    <title>Kavach - Campus Emergency Management</title>
    <meta name="description" content="Kavach is a fast, role-based real-time emergency incident response and campus safety platform." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kavach - Campus Emergency and Incident Response" />
    <meta property="og:description" content="Fast, centralized real-time safety network connecting students, responders, and campus administrators instantly." />
    <meta property="og:image" content="/favicon.svg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kavach - Campus Emergency Management" />
    <meta name="twitter:description" content="Fast, role-based safety platform connecting students and emergency responders in real time." />
    <meta name="twitter:image" content="/favicon.svg" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Simple Hidden Google Translate Setup to work with custom UI buttons -->
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'ta,en', autoDisplay: false}, 'google_translate_element');
      }
      function doGTranslate(lang) {
        var combo = document.querySelector('.goog-te-combo');
        if (combo) {
          combo.value = lang;
          combo.dispatchEvent(new Event('change'));
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
    <style>
      /* Hide the messy google translate top bar */
      body { top: 0px !important; }
      .skiptranslate > iframe.skiptranslate { display: none !important; visibility: hidden !important; }
      #goog-gt-tt { display: none !important; }
    </style>
  </body>
</html>
